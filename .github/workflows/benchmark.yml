name: Performance benchmark

on:
  workflow_dispatch:
  schedule:
    # Monday 10:00 in Asia/Shanghai (GitHub cron uses UTC).
    - cron: '0 2 * * 1'

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-v8:
    name: Node/V8 trend report
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run benchmark:ci
      - name: Explain benchmark scope
        run: |
          {
            echo "## Node/V8 benchmark"
            echo
            echo "This report is trend evidence from a shared GitHub-hosted runner."
            echo "It is not a merge gate and does not represent Hermes or device performance."
            echo "The job fails on execution or delivered-data correctness failures, not on small timing deltas."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark report
        uses: actions/upload-artifact@v6
        with:
          name: node-v8-benchmark-${{ github.run_id }}
          path: benchmark-results/node-v8.json
          if-no-files-found: error
          retention-days: 30
